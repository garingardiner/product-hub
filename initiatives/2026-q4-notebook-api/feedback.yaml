# Feedback itself lives in the shared library (Feedback Board → feedback/library.json).
# This file records which entries matter for this initiative and what they tell us.
# Hypotheses seeded from the brief's "Assumptions" and private-beta learning goals.
hypotheses:
  - id: H-1
    statement: "Target power users will script directly in Python rather than needing a macro-recorder or low-code layer"
    verdict: open
  - id: H-2
    statement: "Users relying on macro/GUI-automation workarounds are representative of the broader power-user base, not a small vocal minority"
    verdict: open
  - id: H-3
    statement: "Scripting a live GUI session is critical for building and debugging, not a nice-to-have next to headless"
    verdict: open
  - id: H-4
    statement: "Agents and scripts build notebooks through a generate -> inspect -> fix loop rather than in one shot, so inspection matters as much as editing"
    verdict: open
  - id: H-5
    statement: "At least three backlogged power-user operations can ship as API calls within one quarter of launch, faster than as GUI features"
    verdict: open
  - id: H-6
    statement: "Once agents can write Python against the API, customers still want an MCP server"
    verdict: open
evidence: []
