# Stable IDs; never reuse a retired ID. Priority: P0 must-have, P1 nice-to-have, P2 future.
# Seeded from the Notebook API brief (MVP, [Draft] Notebook API v1, Release Plan tabs). v1 = Model surface.
requirements:
  # --- Model surface (v1) ---
  - id: R-001
    title: Add a block
    description: Add a block by name, including a specific overload, at a given position; returns its id.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-002
    title: Remove a block
    description: Remove a block and its connections; removing a variable removes it entirely.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-003
    title: Set an input by literal value
    description: Set a block input to a literal for every common type (real, int, bool, text, file path, vector, point, list), not only real/vector/point as in the prototype.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-004
    title: Connect an input to another block's output or property chain
    description: Wire an input to another block's default output, a property, or a dotted property chain (e.g. body.bounding_box.max_point).
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-005
    title: Disconnect an input
    description: Clear a connection or value from a block input.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-006
    title: Name, rename and variables
    description: Set or rename a block's id, make a block into a variable, and rename a variable.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-007
    title: Move a block
    description: Move a block before/after another block or to a section by name.
    priority: P1
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-008
    title: Custom blocks
    description: Add, inspect and wire custom (compound) blocks the same way as built-in blocks.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-009
    title: Inspection for generate -> inspect -> fix
    description: list_blocks, list_connections, get_block and a graph readout, enough for an agent or script to verify what it built. Reads return copies, not mutable references.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-010
    title: Errors and build state
    description: get_errors and an explicit block/build state check after edits.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-011
    title: Typed exceptions, no silent failures
    description: Invalid ids, wrong types and unresolvable property chains raise typed exceptions (e.g. BlockNotFoundError) without side effects where possible. Open decision whether to promote known silent-None cases to errors.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-012
    title: Pythonic, consistent API surface
    description: snake_case throughout, keyword arguments with defaults, keyword-only for 3+ params; base API plus a std library of convenience calls.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-013
    title: Units on set and read
    description: A value can carry a unit when set; decide whether reading back the original unit is required or a documented limitation.
    priority: P1
    status: draft
    acceptance_criteria: []
    evidence: []
  - id: R-014
    title: Enum inputs
    description: A literal syntax for enums, or an accepted decision that enums are wire-only.
    priority: P1
    status: draft
    acceptance_criteria: []
    evidence: []
  - id: R-015
    title: Read list input contents
    description: Read back a list input's contents once set (write-only today).
    priority: P1
    status: draft
    acceptance_criteria: []
    evidence: []
  # --- Tracks / delivery ---
  - id: R-016
    title: Secure live console
    description: Script a running GUI session over an authenticated connection (SSH replaces unauthenticated telnet).
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  - id: R-017
    title: Headless script mode
    description: Same command set run one-shot without a window (e.g. --background file.ntop --python script.py); launches, evaluates, runs script, re-evaluates, exits.
    priority: P1
    status: draft
    acceptance_criteria: []
    evidence: []
  - id: R-018
    title: Headed MCP server
    description: MCP server alongside a live GUI session; one tool per API command, generated from the same definitions.
    priority: P1
    status: draft
    acceptance_criteria: []
    evidence: []
  - id: R-019
    title: Headless MCP server
    description: Persistent MCP server with no GUI. Blocked on licensing/concurrency decision.
    priority: P2
    status: draft
    acceptance_criteria: []
    evidence: []
  - id: R-020
    title: Getting-started agent skill
    description: Skill teaching agents connection, ids, variables, wiring, units, lists and build-state checks; versioned to the nTop build; short, stable gotcha list at GA.
    priority: P0
    status: in-scope
    acceptance_criteria: []
    evidence: []
  # --- Later surfaces (tracked, not v1) ---
  - id: R-021
    title: Viewport commands
    description: Camera, color, viewer tool state, screenshot export (screenshots only where a GPU is available). View API ships after the Notebook API.
    priority: P2
    status: draft
    acceptance_criteria: []
    evidence: []
  - id: R-022
    title: Organization commands
    description: Add/edit sections and comments.
    priority: P2
    status: draft
    acceptance_criteria: []
    evidence: []
  - id: R-023
    title: Notebook lifecycle commands
    description: Create, open and save the notebook file.
    priority: P2
    status: draft
    acceptance_criteria: []
    evidence: []
